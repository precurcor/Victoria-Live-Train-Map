<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victoria Rail Layout Studio</title>
<style>
:root{color-scheme:dark;--bg:#101519;--panel:#192127;--panel2:#202b32;--line:#334047;--text:#e7edf0;--muted:#a3b3bc;--accent:#72cbd0;--warn:#f2c474;--danger:#ffaa9a;--board:#11262c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit;color:inherit}button{background:#27343b;border:1px solid #46555e;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}button:hover{background:#34454e}button.active,button.primary{background:#72cbd0;color:#0c2226;border-color:#72cbd0}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b5f7fa;outline-offset:2px}input,select{min-width:0;width:100%;background:#0f191e;border:1px solid #43505a;border-radius:4px;padding:6px 7px}input[type=checkbox]{width:auto;accent-color:var(--accent)}input[type=number]{font-variant-numeric:tabular-nums}input[type=range]{padding:0}label{display:block;color:var(--muted);font-size:12px;margin:7px 0}label input,label select{margin-top:4px;color:var(--text)}h1,h2,h3,p{margin:0}h1{font-size:15px;font-weight:600;letter-spacing:.2px}h2{font-size:15px;font-weight:550;margin-bottom:12px}h3{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:16px 0 6px}.muted{color:var(--muted)}.small{font-size:11px}.mono{font-family:ui-monospace,Consolas,monospace}header{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#162026}.brand{display:flex;align-items:center;gap:10px;min-width:245px}.logo{display:grid;grid-template-columns:repeat(3,5px);gap:3px;padding:8px;border:1px solid #4e7b81;border-radius:6px}.logo i{width:5px;height:5px;background:var(--accent);border-radius:50%}.subtitle{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}.header-actions{margin-left:auto;display:flex;gap:7px}.project-name{max-width:270px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#acc0c9}.workspace{display:grid;grid-template-columns:255px minmax(300px,1fr) 285px;height:calc(100dvh - 94px)}aside{background:var(--panel);overflow-y:auto;padding:15px;border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line);border-right:0}.tabs{display:flex;gap:4px;margin-bottom:14px}.tabs button{flex:1;padding:6px 2px;font-size:12px}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.row .narrow{flex:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.wide{width:100%}.pill{border:1px solid #426168;border-radius:10px;padding:2px 7px;font-size:10px;color:#b9dce0}.group-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 5px}.list{display:flex;flex-direction:column;gap:3px;margin-top:10px}.list button{border-color:transparent;background:transparent;text-align:left;display:flex;justify-content:space-between;gap:6px;white-space:normal}.list button:hover,.list button.selected{background:#2a3b43;border-color:#48616b}.list .hint{font-size:10px;color:var(--muted);white-space:nowrap;padding-top:3px}.swatch{display:inline-block;width:5px;height:17px;border-radius:2px;margin-right:8px;vertical-align:middle}.line-meta{font-size:11px;color:var(--muted)}.center{position:relative;min-width:0;overflow:hidden;background:#10181e}.tools{height:48px;display:flex;align-items:center;gap:5px;padding:6px 12px;border-bottom:1px solid var(--line);background:#19232a;overflow-x:auto}.tools button{font-size:12px;padding:5px 8px}.tools .divider{height:20px;border-left:1px solid #45555d;margin:0 4px}.toolbar-space{flex:1}.tools label{display:flex;gap:5px;align-items:center;white-space:nowrap}.tools label input{margin:0}.canvas-wrap{position:absolute;inset:48px 0 0;touch-action:none}.canvas-wrap svg{width:100%;height:100%;display:block;user-select:none}.canvas-wrap.pan{cursor:grab}.canvas-wrap.pan.dragging{cursor:grabbing}.help-strip{position:absolute;bottom:14px;left:15px;padding:6px 10px;background:#162128e8;border:1px solid #374951;border-radius:5px;pointer-events:none;font-size:11px;color:#a9bcc7}.view-badge{position:absolute;top:15px;left:15px;font-size:10px;text-transform:uppercase;letter-spacing:1px;background:#183038e8;padding:5px 10px;border:1px solid #40666e;border-radius:4px;pointer-events:none}footer{height:36px;display:flex;align-items:center;gap:20px;padding:0 17px;border-top:1px solid var(--line);background:#131e24;font-size:11px;color:#b2c3cc}footer strong{color:var(--text);font-weight:500}#status{margin-left:auto;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{background:#233139;border-left:3px solid #77bfc7;padding:10px;margin:12px 0;font-size:12px;color:#c5d3d9}.warning{border-left-color:#f2c474;background:#332d22;color:#f1d4a1}.danger{color:#ffb2a1}.separator{border:0;border-top:1px solid var(--line);margin:14px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:8px;background:#101b21;border:1px solid var(--line);border-radius:5px}.stat strong{display:block;font-size:20px;font-weight:500;color:#e8f2f5}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.check{width:100%;text-align:left;white-space:normal;padding:10px;margin-bottom:8px;border-left:3px solid #7eb5cd;background:#13222a;font-size:12px}.check.error{border-left-color:#ffaa9a}.check.warning{border-left-color:#f2c474}.chip{display:inline-flex;align-items:center;gap:5px;border-radius:4px;border:1px solid #40555f;padding:2px 6px;font-size:11px;margin:3px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;font-size:12px}.canvas-label{cursor:move}.n-hit{cursor:move}.e-hit{cursor:pointer}.modal-backdrop{position:fixed;inset:0;background:#05090ed0;z-index:50;display:grid;place-items:center;padding:30px}.modal{background:#19262d;border:1px solid #557079;border-radius:10px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 80px #0008}.modal p{margin:10px 0}.modal li{margin:7px 0}.modal h2{font-size:19px}.modal ul{padding-left:20px}.modal code{color:#c2e9ee}.modal table{border-collapse:collapse;width:100%;font-size:12px}.modal td{padding:8px;border-bottom:1px solid #3c4b54}.close-row{display:flex;justify-content:space-between;align-items:center}.notification{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);max-width:660px;background:#263c44;border:1px solid #a2c8d1;border-radius:6px;padding:12px 18px;z-index:100;box-shadow:0 4px 30px #0008}.progress{padding:20px;text-align:center}.hide{display:none!important}.hint-key{border:1px solid #48616e;border-radius:3px;padding:1px 4px;color:#bfd7e2}.selected-outline{stroke:#a6faff;stroke-width:.4;fill:#6edbe418;pointer-events:none}.hardware-raw{opacity:.65}.pending-shape{stroke:#f8c788;stroke-width:.35;stroke-dasharray:1.6 .8;fill:#735a2320}.export-option{padding:12px;border:1px solid #40535b;border-radius:6px;margin:10px 0}.export-option strong{display:block}.table-scroll{max-height:240px;overflow:auto}.kbd-hint{font-size:11px;margin-top:10px;color:#a8c1cc}@media(max-width:1150px){.workspace{grid-template-columns:210px minmax(260px,1fr) 255px}.brand{min-width:200px}.project-name{display:none}aside{padding:12px}}@media(max-width:850px){.workspace{grid-template-columns:180px minmax(200px,1fr)}aside.right{position:absolute;right:0;top:106px;bottom:36px;width:255px;z-index:15;box-shadow:-4px 0 20px #0009}.right.collapsed{display:none}.header-actions button{padding:6px;font-size:11px}header{padding:0 8px;gap:6px}.brand{min-width:170px}.brand h1{font-size:12px}.subtitle{font-size:8px}.logo{display:none}footer{gap:8px}#status{display:none}}@media(max-width:570px){.workspace{grid-template-columns:1fr}aside.left{position:absolute;left:0;top:106px;bottom:36px;width:220px;z-index:16;box-shadow:4px 0 20px #0009}aside.left.collapsed{display:none}.header-actions .secondary-head{display:none}.brand{min-width:140px}}
.workspace{grid-template-columns:var(--left-width,255px) minmax(200px,1fr) var(--right-width,285px);grid-template-areas:"library work inspector"}.left{grid-area:library}.center{grid-area:work}.right{grid-area:inspector}.workspace:has(.left.collapsed){--left-width:0px}.workspace:has(.right.collapsed){--right-width:0px}aside.collapsed{display:none}@media(max-width:1150px){.workspace{--left-width:210px;--right-width:255px}}@media(max-width:850px){.workspace{--left-width:180px;grid-template-columns:var(--left-width) minmax(200px,1fr);grid-template-areas:"library work"}.right{grid-area:auto}}@media(max-width:570px){.workspace{grid-template-columns:1fr;grid-template-areas:"work"}.left{grid-area:auto}}
textarea{font:inherit;color:var(--text);background:#0f191e;border:1px solid #43505a;border-radius:4px;padding:6px 7px;display:block;width:100%;margin-top:4px;resize:vertical}textarea:focus-visible{outline:2px solid #b5f7fa;outline-offset:2px}
</style>
</head>
<body>
<header><div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><h1>Victoria Rail Layout Studio</h1><div class="subtitle">Physical network designer · v1.0</div></div></div><div class="project-name" id="projectName"></div><div class="header-actions"><button data-action="new" class="secondary-head">Projects</button><button data-action="open">Open</button><button data-action="save">Save project</button><button data-action="export" class="primary">Export KiCad</button><button data-action="help" aria-label="Help and shortcuts">?</button></div></header>
<div class="workspace">
<aside class="left" id="leftPanel"><div class="tabs"><button data-tab="stations" class="active">Stations</button><button data-tab="hardware">Hardware</button><button data-tab="board">Board</button></div><div id="leftContent"></div></aside>
<main class="center"><div class="tools"><button data-action="toggleLibrary" title="Toggle library">Library</button><button data-tool="select" class="active">Select</button><button data-tool="pan">Pan</button><button data-tool="connect">Connect</button><span class="divider"></span><button data-action="undo" id="undoButton" title="Ctrl+Z">↶</button><button data-action="redo" id="redoButton" title="Ctrl+Shift+Z">↷</button><span class="divider"></span><button data-action="fit">Fit board</button><button data-action="camberwell">Camberwell</button><button data-action="preview">Preview</button><span class="toolbar-space"></span><label><input type="checkbox" id="showGrid" checked>Grid</label><button data-action="toggleInspector">Inspector</button></div>
<div class="canvas-wrap" id="canvasWrap"><svg id="canvas" role="img" aria-label="Interactive physical rail PCB layout in millimetres" xmlns="http://www.w3.org/2000/svg"></svg><div class="view-badge" id="viewBadge">PCB layout · millimetres</div><div class="help-strip" id="canvasHelp">Drag to move · Wheel to zoom · Space + drag to pan · Shift-click to multi-select</div></div></main>
<aside class="right" id="rightPanel"><div id="inspector"></div></aside>
</div>
<footer><span><strong id="ledCount">0</strong> LEDs</span><span><strong id="stationCount">0</strong> station labels</span><span id="boardSize"></span><span id="zoomLevel"></span><button id="checksButton" data-action="checks" style="padding:2px 7px;font-size:10px">Design checks</button><span id="status" role="status" aria-live="polite">Ready</span></footer>
<input type="file" id="openFile" accept=".json,.rail" hidden><input type="file" id="footprintFile" accept=".kicad_mod" hidden>
<div id="modalHost"></div><div id="toast" class="notification hide" role="alert"></div>
